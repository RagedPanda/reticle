name: WebMCP native qualification

# Opt-in until an exact browser/flag profile has native evidence. Missing APIs fail the run.
on:
  workflow_dispatch:
    inputs:
      browser_args:
        description: Browser switches as a JSON array for this native WebMCP profile
        type: string
        required: true
        default: '[]'
      input_encoding:
        description: Native executeTool input format to qualify
        type: choice
        options: [object, json]
        default: object

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        headed: ['0', '1']
    env:
      RETICLE_TELEMETRY: '0'
      RETICLE_WEBMCP_HEADED: ${{ matrix.headed }}
      RETICLE_WEBMCP_BROWSER_ARGS: ${{ inputs.browser_args }}
      RETICLE_WEBMCP_INPUT_ENCODING: ${{ inputs.input_encoding }}
      RETICLE_WEBMCP_REPORT: ${{ runner.temp }}/webmcp-native/qualification.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The lockfile pins Playwright and therefore its Chromium revision.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Qualify the native profile
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/webmcp-native"
          xvfb-run -a pnpm test:webmcp:native 2>&1 | tee "$RUNNER_TEMP/webmcp-native/run.log"
      - name: Retain evidence even when qualification fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webmcp-native-headed-${{ matrix.headed }}-${{ inputs.input_encoding }}
          path: ${{ runner.temp }}/webmcp-native/
          if-no-files-found: error
